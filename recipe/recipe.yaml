schema_version: 1

context:
  name: gcloud-aio-kms
  version: "5.1.0"

package:
  name: ${{ name|lower }}
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/${{ name[0] }}/${{ name }}/gcloud_aio_kms-${{ version }}.tar.gz
  sha256: 6b92cbd53fa41ed3d3d4c02c43efa266a49b8fa317f85d5d0426f719676fa9ae

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv

requirements:
  host:
    - python ${{ python_min }}.*
    - poetry-core >=1.0.0
    - pip
  run:
    - python >=${{ python_min }},<4.0
    - gcloud-aio-auth >=3.1.0,<6.0.0

tests:
  - python:
      imports:
        - gcloud.aio.kms
      pip_check: true
      python_version: ${{ python_min }}.*

about:
  summary: Python Client for Google Cloud KMS
  license: MIT
  license_file: LICENSE.txt
  homepage: https://github.com/talkiq/gcloud-aio

extra:
  recipe-maintainers:
    - xylar
